<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Neon Flux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 滑鼠與觸控座標追蹤
        const mouse = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2,
            isDown: false
        };

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        window.addEventListener('mousedown', () => mouse.isDown = true);
        window.addEventListener('mouseup', () => mouse.isDown = false);

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchstart', () => mouse.isDown = true);
        window.addEventListener('touchend', () => mouse.isDown = false);

        // 建立高密度動態粒子
        const particleCount = 2000;
        const particles = [];

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.baseSize = Math.random() * 2 + 1;
                this.size = this.baseSize;
                this.colorHue = Math.random() * 60 + 180; // 青藍到紫羅蘭色系
                this.life = Math.random() * 500 + 200;
                this.maxLife = this.life;
            }

            update(time) {
                // 計算與滑鼠的距離與角度
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let angle = Math.atan2(dy, dx);

                // 流體數學場模擬 (Simulated Perlin-like Flow)
                let noise = Math.sin(this.x * 0.003 + time * 0.001) + Math.cos(this.y * 0.003 + time * 0.001);
                
                let moveAngle = noise * Math.PI * 2;
                let speed = 1.5;

                if (dist < 250) {
                    let force = (1 - dist / 250);
                    if (mouse.isDown) {
                        // 按下滑鼠時產生強烈黑洞引力與光束加速
                        this.vx += Math.cos(angle) * force * 1.5;
                        this.vy += Math.sin(angle) * force * 1.5;
                        speed = 4;
                        this.colorHue = (this.colorHue + 2) % 360;
                    } else {
                        // 靠近滑鼠時形成優雅的旋渦軌道
                        this.vx += Math.cos(angle + Math.PI / 2) * force * 0.8;
                        this.vy += Math.sin(angle + Math.PI / 2) * force * 0.8;
                    }
                }

                // 套用流場速度
                this.vx += Math.cos(moveAngle) * 0.1;
                this.vy += Math.sin(moveAngle) * 0.1;

                // 速度阻尼（保持流暢不暴衝）
                this.vx *= 0.92;
                this.vy *= 0.92;

                this.x += this.vx + Math.cos(moveAngle) * speed;
                this.y += this.vy + Math.sin(moveAngle) * speed;

                // 邊界穿梭
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.colorHue}, 100%, 65%)`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `hsl(${this.colorHue}, 100%, 50%)`;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        let time = 0;

        function animate() {
            // 殘影漸層背景，營造極佳的視覺拖尾與深邃感
            ctx.fillStyle = 'rgba(3, 3, 8, 0.12)';
            ctx.fillRect(0, 0, width, height);

            time++;

            // 平滑緩動滑鼠座標
            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            // 繪製中心動態高能發光核心
            let coreGrad = ctx.createRadialGradient(mouse.x, mouse.y, 5, mouse.x, mouse.y, 350);
            coreGrad.addColorStop(0, mouse.isDown ? 'rgba(180, 0, 255, 0.25)' : 'rgba(0, 220, 255, 0.12)');
            coreGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = coreGrad;
            ctx.fillRect(0, 0, width, height);

            // 更新與渲染粒子
            particles.forEach(p => {
                p.update(time);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
