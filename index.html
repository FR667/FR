<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗影 - FR AI 科技公司 | 頂級數位官方名片</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100%;
            background-color: #03030c;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .universe {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0f0c29, #302b63, #24243e);
            padding: 50px 20px;
            overflow: hidden;
        }

        /* 宇宙動態霓虹背景 */
        .universe::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, #ff007f, #7f00ff, #00f0ff, #00ff7f, #ff007f);
            animation: rotateGlow 20s linear infinite;
            opacity: 0.12;
            filter: blur(90px);
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 頂級液態玻璃主容器 (整合官網內容) */
        .liquid-glass-master {
            position: relative;
            width: 100%;
            max-width: 850px;
            border-radius: 35px;
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.25),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            padding: 50px 40px;
            overflow: hidden;
            z-index: 2;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .liquid-glass-master:hover {
            box-shadow: 0 50px 120px rgba(0, 240, 255, 0.18),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.9);
        }

        /* 流動電浆光波背景 */
        .plasma-wave {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,240,255,0.25) 0%, rgba(127,0,255,0.15) 40%, transparent 70%);
            mix-blend-mode: screen;
            transition: transform 0.2s ease-out;
            pointer-events: none;
            filter: blur(30px);
            z-index: 1;
        }

        /* 內容層 */
        .content-layer {
            position: relative;
            z-index: 3;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* 名片頂部：個人與身分 */
        .card-top {
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 30px;
        }

        .avatar-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.6);
            background: rgba(0, 240, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0,240,255,0.3);
            flex-shrink: 0;
        }

        .avatar-box i {
            font-size: 2.5rem;
            color: #00f0ff;
        }

        .identity-info .company-tag {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #00f0ff;
            font-weight: 700;
            margin-bottom: 5px;
            display: block;
            text-shadow: 0 0 8px rgba(0,240,255,0.5);
        }

        .identity-info h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .identity-info .role {
            font-size: 0.95rem;
            color: #a5a2b0;
            letter-spacing: 1px;
        }

        /* 官網核心模組排版 */
        .official-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .module-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 22px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #ff007f;
            opacity: 0.8;
        }

        .module-card.tech::before { background: #00f0ff; }
        .module-card.security::before { background: #7f00ff; }

        .module-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,240,255,0.12);
        }

        .module-card h3 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-card h3 i {
            color: #00f0ff;
        }

        .module-card p {
            font-size: 0.88rem;
            color: #bcbcd0;
            line-height: 1.6;
        }

        /* 企業生態系橫幅 */
        .ecosystem-banner {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ecosystem-title {
            font-size: 0.9rem;
            color: #00f0ff;
            letter-spacing: 1px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ecosystem-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .eco-tag {
            background: rgba(127, 0, 255, 0.15);
            border: 1px solid rgba(127, 0, 255, 0.4);
            padding: 7px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eco-tag i {
            color: #00f0ff;
            font-size: 0.8rem;
        }

        /* 響應式微調 */
        @media(max-width: 650px) {
            .liquid-glass-master { padding: 30px 20px; }
            .card-top { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="universe">
        <div class="liquid-glass-master" id="glassContainer">
            <div class="plasma-wave" id="plasmaWave"></div>
            
            <div class="content-layer">
                <!-- 頂部名片身分 -->
                <div class="card-top">
                    <div class="avatar-box">
                        <i class="fas fa-user-secret"></i>
                    </div>
                    <div class="identity-info">
                        <span class="company-tag">FR AI TECHNOLOGY • 官方數位證件</span>
                        <h1>暗影</h1>
                        <div class="role">最高技術管理者 / 創辦人</div>
                    </div>
                </div>

                <!-- 官網核心技術與架構內容整合 -->
                <div class="official-grid">
                    <div class="module-card tech">
                        <h3><i class="fas fa-microchip"></i> 核心技術領域</h3>
                        <p>專注於現代前端網頁技術、系統級核心開發與高效能運算。提供從高互動性使用者介面到底層系統優化的全方位解決方案[cite: 1]。</p>
                    </div>

                    <div class="module-card security">
                        <h3><i class="fas fa-shield-alt"></i> 系統優勢與架構</h3>
                        <p>具備精簡程式碼結構、毫秒級硬體反應速度及完善資安防禦。支援標準網頁建置、C/C++ 底層硬體通訊與高可靠度跨平台架構[cite: 1]。</p>
                    </div>
                </div>

                <!-- 企業生態系夥伴 -->
                <div class="ecosystem-banner">
                    <div class="ecosystem-title">
                        <i class="fas fa-network-wired"></i> 企業生態系與跨界聯盟
                    </div>
                    <div class="ecosystem-tags">
                        <div class="eco-tag"><i class="fas fa-server"></i> FR AI 核心研發中心</div>
                        <div class="eco-tag"><i class="fas fa-laptop-code"></i> RR 科技公司（創新軟體研發）[cite: 1]</div>
                        <div class="eco-tag"><i class="fas fa-paint-brush"></i> HLSS 專業網頁公司（UI/UX 與前端應用）[cite: 1]</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('glassContainer');
        const plasma = document.getElementById('plasmaWave');

        // 滑鼠移動互動：光波跟隨與精緻 3D 旋轉傾斜
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            plasma.style.transform = `translate(${x * 0.25}px, ${y * 0.25}px) scale(1.15)`;
            
            const tiltX = -(y / rect.height) * 10;
            const tiltY = (x / rect.width) * 10;
            container.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.01)`;
        });

        container.addEventListener('mouseleave', () => {
            plasma.style.transform = `translate(0px, 0px) scale(1)`;
            container.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
        });
    </script>
</body>
</html>
