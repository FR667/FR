<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗影 - FR AI 科技公司 | 數位名片與官方簡介</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100%;
            background-color: #03030c;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .universe {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at center, #0f0c29, #302b63, #24243e);
            padding: 50px 20px;
            overflow-x: hidden;
        }

        /* 科技漸層背景光暈 */
        .universe::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, #ff007f, #7f00ff, #00f0ff, #00ff7f, #ff007f);
            animation: rotateGlow 15s linear infinite;
            opacity: 0.15;
            filter: blur(80px);
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 懸浮科幻環圈 */
        .sci-fi-ring {
            position: absolute;
            width: 700px;
            height: 700px;
            border: 2px dashed rgba(0, 240, 255, 0.15);
            border-radius: 50%;
            animation: spinRing 30s linear infinite;
            pointer-events: none;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        @keyframes spinRing {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        /* 主容器佈局 */
        .main-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* 液態玻璃名片區塊 */
        .liquid-glass-card {
            position: relative;
            width: 100%;
            max-width: 480px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.5s ease;
        }

        .liquid-glass-card:hover {
            transform: scale(1.02);
            box-shadow: 0 40px 80px rgba(0, 240, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.8);
        }

        /* 內部動態液面與科技光波 */
        .plasma-wave {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, rgba(127,0,255,0.2) 50%, transparent 70%);
            mix-blend-mode: screen;
            transition: transform 0.2s ease-out;
            pointer-events: none;
            filter: blur(20px);
            z-index: 1;
        }

        /* 互動式液面波紋點 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,240,255,0.4) 40%, transparent 70%);
            transform: scale(0);
            animation: rippleEffect 1s cubic-bezier(0, 0.2, 0.8, 1) forwards;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .card-content {
            position: relative;
            z-index: 3;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .company-tag {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .card-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .avatar-frame {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }

        .avatar-frame i {
            font-size: 2.5rem;
            color: #00f0ff;
        }

        .name-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .role-title {
            font-size: 0.95rem;
            color: #a5a2b0;
            letter-spacing: 1px;
        }

        /* 官網內容區塊 */
        .company-info-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .info-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00f0ff;
            margin-bottom: 20px;
            border-left: 4px solid #00f0ff;
            padding-left: 12px;
            letter-spacing: 1px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 22px;
            transition: 0.3s;
        }

        .info-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,240,255,0.15);
        }

        .info-card h3 {
            font-size: 1.05rem;
            color: #ff007f;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card p {
            font-size: 0.9rem;
            color: #cfcfea;
            line-height: 1.7;
        }

        .ecosystem-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .ecosystem-item {
            background: rgba(127, 0, 255, 0.15);
            border: 1, 1px solid rgba(127, 0, 255, 0.4);
            border: 1px solid rgba(127, 0, 255, 0.4);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ecosystem-item i {
            color: #00f0ff;
        }
    </style>
</head>
<body>

    <div class="universe">
        <div class="sci-fi-ring"></div>
        
        <div class="main-wrapper">
            <!-- 液態玻璃數位名片 -->
            <div class="liquid-glass-card" id="glassContainer">
                <div class="plasma-wave" id="plasmaWave"></div>
                
                <div class="card-content">
                    <div class="card-header">
                        <span class="company-tag">FR AI TECHNOLOGY</span>
                        <h1>數位名片</h1>
                    </div>

                    <div class="avatar-frame">
                        <i class="fas fa-user-secret"></i>
                    </div>
                    <div class="name-title">暗影</div>
                    <div class="role-title">最高技術管理者 / 創辦人</div>
                </div>
            </div>

            <!-- FR 科技公司官網內容整合區塊 -->
            <div class="company-info-section">
                <div class="info-title">FR AI 科技公司 • 核心技術與優勢</div>
                
                <div class="info-grid">
                    <div class="info-card">
                        <h3><i class="fas fa-microchip"></i> 核心技術領域</h3>
                        <p>專注於現代前端網頁技術、系統級核心開發與高效能運算。從高互動性使用者介面設計到底層系統優化，提供全方位的頂級數位解決方案。</p>
                    </div>
                    <div class="info-card">
                        <h3><i class="fas fa-shield-alt"></i> 系統架構與防護</h3>
                        <p>具備精簡的程式碼結構、毫秒級的硬體反應速度及完善的資安防禦機制。支援標準網頁建置、C/C++ 底層硬體通訊，以及高可靠度跨平台架構。</p>
                    </div>
                </div>

                <div class="info-title">企業生態系與合作夥伴</div>
                <ul class="ecosystem-list">
                    <li class="ecosystem-item"><i class="fas fa-network-wired"></i> FR AI 核心研發中心</li>
                    <li class="ecosystem-item"><i class="fas fa-laptop-code"></i> RR 科技公司（創新軟體研發）</li>
                    <li class="ecosystem-item"><i class="fas fa-paint-brush"></i> HLSS 專業網頁公司（UI/UX 與前端應用）</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('glassContainer');
        const plasma = document.getElementById('plasmaWave');

        // 滑鼠移動時液面與光波跟隨與流動
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            plasma.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) scale(1.2)`;
            
            // 輕微 3D 傾斜效果
            const tiltX = -(y / rect.height) * 15;
            const tiltY = (x / rect.width) * 15;
            container.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.02)`;
        });

        container.addEventListener('mouseleave', () => {
            plasma.style.transform = `translate(0px, 0px) scale(1)`;
            container.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
        });

        // 點擊產生液面波動擴散
        container.addEventListener('click', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = '100px';
            ripple.style.height = '100px';
            ripple.style.marginLeft = '-50px';
            ripple.style.marginTop = '-50px';

            container.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 1000);
        });
    </script>
</body>
</html>
