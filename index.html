<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 第一人稱跑酷原型</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            color: white;
            cursor: pointer;
            z-index: 10;
        }
        #instructions h1 { margin: 0 0 10px 0; color: #00ffcc; }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>3D 跑酷挑戰</h1>
        <p>點擊此處開始遊戲</p>
        <p>[W][A][S][D] 移動 | [空白鍵] 跳躍 | [滑鼠] 視角</p>
    </div>

    <div id="crosshair"></div>
    
    <div id="info">
        狀態: <span id="status" style="color: #00ffcc;">準備開始</span><br>
        速度: <span id="speed">0.0</span><br>
        高度: <span id="height">0.0</span>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;

        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        let prevTime = performance.now();
        const platforms = [];

        const instructions = document.getElementById('instructions');

        init();
        animate();

        function init() {
            // 1. 場景與相機
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            scene.fog = new THREE.FogExp2(0x111122, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // 2. 燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 3. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. 指針鎖定控制 (PointerLock)
            instructions.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === renderer.domElement) {
                    instructions.style.display = 'none';
                } else {
                    instructions.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);

            // 5. 建立關卡 (平台陣列)
            createLevel();

            window.addEventListener('resize', onWindowResize, false);
        }

        // 建立跑酷關卡
        function createLevel() {
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x223344, 
                roughness: 0.4,
                metalness: 0.2
            });
            const hazardMaterial = new THREE.MeshStandardMaterial({ color: 0xff3333 });
            const startMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffcc });

            // 起始平台
            addPlatform(0, 0, 0, 15, 2, 15, startMaterial);

            // 隨機生成一系列跳躍平台
            let zPos = -20;
            let xPos = 0;
            let yPos = 0;

            for (let i = 0; i < 20; i++) {
                xPos += (Math.random() - 0.5) * 12;
                yPos += (Math.random() * 4) - 1; // 隨機高低起伏
                zPos -= 15 + Math.random() * 5;

                const width = Math.max(4, 10 - i * 0.2);
                const depth = Math.max(4, 10 - i * 0.2);

                addPlatform(xPos, yPos, zPos, width, 2, depth, material);
            }

            // 終點平台
            addPlatform(0, yPos + 2, zPos - 20, 10, 2, 10, startMaterial);
        }

        function addPlatform(x, y, z, w, h, d, mat) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // 儲存邊界數據用於碰撞檢測
            platforms.push({
                mesh: mesh,
                box: new THREE.Box3().setFromObject(mesh)
            });
        }

        // 滑鼠視角控制
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;

        function onMouseMove(event) {
            if (document.pointerLockElement !== renderer.domElement) return;

            const movementX = event.movementX || event.mozMovementX || event.webKitMovementX || 0;
            const movementY = event.movementY || event.mozMovementY || event.webKitMovementY || 0;

            euler.setFromQuaternion(camera.quaternion);

            euler.y -= movementX * 0.002;
            euler.x -= movementY * 0.002;

            euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));

            camera.quaternion.setFromEuler(euler);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space':
                    if (canJump) {
                        velocity.y += 12; // 跳躍力道
                        canJump = false;
                    }
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 遊戲主迴圈
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === renderer.domElement) {
                // 1. 套用重力
                velocity.y -= 30 * delta;

                // 2. 移動方向計算
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // 確保斜向移動速度不變快

                // 空中加速與地面移動摩擦力
                const speedMultiplier = canJump ? 400.0 : 150.0; 

                if (moveForward || moveBackward) velocity.z -= direction.z * speedMultiplier * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speedMultiplier * delta;

                // 摩擦力減速
                if (canJump) {
                    velocity.x *= 0.85;
                    velocity.z *= 0.85;
                } else {
                    velocity.x *= 0.98; // 空中維持慣性 (Bhop 核心)
                    velocity.z *= 0.98;
                }

                // 3. 套用位移
                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // 4. 簡易 AABB 碰撞與平台檢測
                canJump = false;
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(camera.position.x - 0.6, camera.position.y - 1.8, camera.position.z - 0.6),
                    new THREE.Vector3(camera.position.x + 0.6, camera.position.y, camera.position.z + 0.6)
                );

                for (let i = 0; i < platforms.length; i++) {
                    const p = platforms[i];
                    if (playerBox.intersectsBox(p.box)) {
                        // 檢測是否落在平台上方
                        const pTop = p.mesh.position.y + 1;
                        if (camera.position.y >= pTop - 0.5 && velocity.y <= 0) {
                            camera.position.y = pTop + 1.8;
                            velocity.y = 0;
                            canJump = true;
                        }
                    }
                }

                // 5. 掉落死亡重置
                if (camera.position.y < -30) {
                    camera.position.set(0, 5, 10);
                    velocity.set(0, 0, 0);
                }

                // 更新 UI 數據
                document.getElementById('speed').innerText = Math.sqrt(velocity.x**2 + velocity.z**2).toFixed(1);
                document.getElementById('height').innerText = camera.position.y.toFixed(1);
                document.getElementById('status').innerText = canJump ? "在地面 (可跳躍)" : "空中 (慣性滑行)";
                document.getElementById('status').style.color = canJump ? "#00ffcc" : "#ffcc00";
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
