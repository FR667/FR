<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: monospace;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // 燈光系統
        const ambientLight = new THREE.AmbientLight(0x101525, 2.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f3ff, 3.0);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 30;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff0055, 4, 30);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // 金屬材質定義
        const metalMaterial = new THREE.MeshStandardMaterial({
            color: 0x111318,
            metalness: 0.95,
            roughness: 0.15,
            wireframe: false
        });

        const neonCyanMaterial = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            emissive: 0x00f3ff,
            emissiveIntensity: 2.0,
            metalness: 0.2,
            roughness: 0.1
        });

        const neonPinkMaterial = new THREE.MeshStandardMaterial({
            color: 0xff0055,
            emissive: 0xff0055,
            emissiveIntensity: 2.0,
            metalness: 0.2,
            roughness: 0.1
        });

        // 玩家物件 (金屬方塊)
        const playerGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const playerMat = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x004455,
            emissiveIntensity: 0.5
        });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.castShadow = true;
        player.receiveShadow = true;
        scene.add(player);

        // 玩家發光內核
        const coreGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const playerCore = new THREE.Mesh(coreGeo, coreMat);
        player.add(playerCore);

        // 物理與遊戲狀態
        let playerPos = new THREE.Vector3(0, 5, 0);
        let playerVel = new THREE.Vector3(0, 0, 0);
        const gravity = -0.025;
        const jumpForce = 0.42;
        const moveSpeed = 0.18;
        let isGrounded = false;

        // 輸入控制
        const keys = { w: false, a: false, s: false, d: false, space: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
            if (e.code === 'Space') {
                if (isGrounded) {
                    playerVel.y = jumpForce;
                    isGrounded = false;
                }
                keys.space = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 滑鼠視角控制
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;

        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                cameraAngleX -= e.movementX * 0.005;
                cameraAngleY = Math.max(0.1, Math.min(1.2, cameraAngleY - e.movementY * 0.005));
            }
        });

        // 觸控支援
        let touchX = 0, touchY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
                if (isGrounded) {
                    playerVel.y = jumpForce;
                    isGrounded = false;
                }
            }
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                let dx = e.touches[0].clientX - touchX;
                let dy = e.touches[0].clientY - touchY;
                cameraAngleX -= dx * 0.005;
                cameraAngleY = Math.max(0.1, Math.min(1.2, cameraAngleY - dy * 0.005));
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        }, {passive: true});

        // 產生地圖平台
        const platforms = [];
        const platformGeo = new THREE.BoxGeometry(1, 1, 1);

        function createPlatform(x, y, z, sx, sy, sz, isMoving = false) {
            const group = new THREE.Group();
            
            // 主金屬體
            const mesh = new THREE.Mesh(platformGeo, metalMaterial);
            mesh.scale.set(sx, sy, sz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            // 霓虹邊框裝飾
            const edgeGeo = new THREE.BoxGeometry(sx + 0.1, 0.1, sz + 0.1);
            const edgeMesh = new THREE.Mesh(edgeGeo, Math.random() > 0.5 ? neonCyanMaterial : neonPinkMaterial);
            edgeMesh.position.y = sy / 2;
            group.add(edgeMesh);

            group.position.set(x, y, z);
            scene.add(group);

            platforms.push({
                mesh: group,
                x, y, z, sx, sy, sz,
                isMoving,
                moveOffset: Math.random() * Math.PI * 2
            });
        }

        // 建造無限跑酷關卡
        createPlatform(0, 0, 0, 8, 1, 8);
        createPlatform(0, 0, -12, 6, 1, 6);
        createPlatform(5, 1.5, -22, 5, 1, 5, true);
        createPlatform(-4, 3, -32, 6, 1, 6);
        createPlatform(0, 4.5, -44, 5, 1, 10);
        createPlatform(-6, 6, -58, 5, 1, 5);
        createPlatform(4, 7.5, -70, 6, 1, 6, true);
        createPlatform(0, 9, -84, 8, 1, 12);

        // 背景動態霓虹柱
        for (let i = 0; i < 40; i++) {
            const h = Math.random() * 20 + 10;
            const pillarGeo = new THREE.BoxGeometry(1, h, 1);
            const pillar = new THREE.Mesh(pillarGeo, Math.random() > 0.5 ? neonCyanMaterial : neonPinkMaterial);
            pillar.position.set(
                (Math.random() - 0.5) * 80,
                h / 2 - 10,
                (Math.random() - 0.5) * 150 - 40
            );
            scene.add(pillar);
        }

        // 動畫主循環
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();
            let time = clock.getElapsedTime();

            // 移動平台運算
            platforms.forEach(p => {
                if (p.isMoving) {
                    p.mesh.position.x = p.x + Math.sin(time * 2 + p.moveOffset) * 4;
                }
            });

            // 攝影機方向基準的移動向量
            let forward = new THREE.Vector3(Math.sin(cameraAngleX), 0, Math.cos(cameraAngleX));
            let right = new THREE.Vector3(Math.cos(cameraAngleX), 0, -Math.sin(cameraAngleX));

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w || keys.space) moveDir.add(forward);
            if (keys.s) moveDir.sub(forward);
            if (keys.d) moveDir.add(right);
            if (keys.a) moveDir.sub(right);
            moveDir.normalize();

            playerVel.x = moveDir.x * moveSpeed;
            playerVel.z = moveDir.z * moveSpeed;

            // 套用重力
            playerVel.y += gravity;
            playerPos.add(playerVel);

            // 嚴謹的碰撞檢測與防穿模機制
            isGrounded = false;
            let playerBox = {
                minX: playerPos.x - 0.6, maxX: playerPos.x + 0.6,
                minY: playerPos.y - 0.6, maxY: playerPos.y + 0.6,
                minZ: playerPos.z - 0.6, maxZ: playerPos.z + 0.6
            };

            platforms.forEach(p => {
                let pWorldX = p.isMoving ? p.x + Math.sin(time * 2 + p.moveOffset) * 4 : p.x;
                let pMinX = pWorldX - p.sx / 2, pMaxX = pWorldX + p.sx / 2;
                let pMinY = p.y - p.sy / 2, pMaxY = p.y + p.sy / 2;
                let pMinZ = p.z - p.sz / 2, pMaxZ = p.z + p.sz / 2;

                if (playerBox.maxX > pMinX && playerBox.minX < pMaxX &&
                    playerBox.maxZ > pMinZ && playerBox.minZ < pMaxZ) {
                    
                    // 降落頂部碰撞
                    if (playerVel.y <= 0 && playerPos.y - 0.6 <= pMaxY && playerPos.y - 0.6 >= pMaxY - 0.8) {
                        playerPos.y = pMaxY + 0.6;
                        playerVel.y = 0;
                        isGrounded = true;
                    }
                }
            });

            // 掉落深淵重置
            if (playerPos.y < -20) {
                playerPos.set(0, 5, 0);
                playerVel.set(0, 0, 0);
            }

            player.position.copy(playerPos);
            player.rotation.y += 0.02;

            // 攝影機跟隨
            let targetCamX = playerPos.x - Math.sin(cameraAngleX) * 10;
            let targetCamY = playerPos.y + Math.sin(cameraAngleY) * 8 + 2;
            let targetCamZ = playerPos.z - Math.cos(cameraAngleX) * 10;

            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (targetCamY - camera.position.y) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            camera.lookAt(playerPos.x, playerPos.y + 1, playerPos.z);

            // 動態燈光跟隨
            pointLight.position.copy(playerPos);
            pointLight.position.y += 2;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
